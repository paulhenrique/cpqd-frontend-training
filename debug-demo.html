<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #222; color: #eee; }
        .card { background: #333; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #444; color: white; width: 70%; }
        button { padding: 8px 16px; border-radius: 4px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        ul { list-style: none; padding: 0; margin-top: 1rem; }
        li { background: #444; margin-bottom: 0.5rem; padding: 0.5rem 1rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        li.done span { text-decoration: line-through; opacity: 0.6; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐛 Debugging Demo</h1>
        <div style="display: flex; gap: 8px; margin-bottom: 1rem;">
            <input type="text" id="todoInput" placeholder="Add a new task...">
            <button onclick="addTodo()">Add</button>
        </div>
        
        <div style="margin-bottom: 1rem;">
            <button onclick="fetchExternalTodos()" style="background: #10b981;">Fetch API Data</button>
            <button onclick="causeError()" style="background: #ef4444;">Trigger Error</button>
        </div>

        <ul id="todoList">
            <!-- Items will appear here -->
        </ul>
    </div>

    <script>
        // Simulação de Logger (Pino-like)
        const logger = {
            info: (msg, data) => console.info(`%c[INFO] ${msg}`, 'color: #3b82f6', data || ''),
            error: (msg, err) => console.error(`%c[ERROR] ${msg}`, 'color: #ef4444', err || ''),
            warn: (msg) => console.warn(`%c[WARN] ${msg}`, 'color: #f59e0b'),
        };

        // Estado inicial
        let todos = [
            { id: 1, text: "Aprender Debugging", done: false },
            { id: 2, text: "Dominar Breakpoints", done: false }
        ];

        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            // PONTO DE PARADA SUGERIDO (Breakpoint here)
            // Use o DevTools para inspecionar 'todos' antes do loop
            debugger; 

            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = todo.done ? 'done' : '';
                li.innerHTML = `
                    <span>${todo.text}</span>
                    <button onclick="toggleTodo(${todo.id})" style="background: transparent; border: 1px solid #666; font-size: 0.8rem;">
                        ${todo.done ? 'Undo' : 'Done'}
                    </button>
                `;
                list.appendChild(li);
            });
            
            logger.info('Render completed', { count: todos.length });
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            
            if (!text) {
                logger.warn('Tentativa de adicionar todo vazio');
                return;
            }

            const newTodo = {
                id: Date.now(),
                text: text,
                done: false
            };

            // Passo a passo (Step Over/Into demonstration)
            processNewTodo(newTodo);
            
            input.value = '';
        }

        function processNewTodo(todo) {
            // Função intermediária para demonstrar Stack Trace
            todos.push(todo);
            logger.info('Todo added', todo);
            render();
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.done = !todo.done;
                render();
            }
        }

        async function fetchExternalTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = '<div class="loading">Loading from JSONPlaceholder...</div>';
            
            try {
                logger.info('Iniciando fetch...');
                
                // Network Tab demonstration
                const response = await fetch('https://jsonplaceholder.typicode.com/todos?_limit=3');
                
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                // Mapeando dados externos
                const externalTodos = data.map(t => ({
                    id: t.id, // ID conflitante intencional para mostrar bugs potenciais?
                    text: `[API] ${t.title}`,
                    done: t.completed
                }));

                todos = [...todos, ...externalTodos];
                render();
                logger.info('Dados carregados com sucesso', data);

            } catch (error) {
                logger.error('Falha ao buscar dados', error);
                list.innerHTML = '<div style="color: red">Erro ao carregar dados!</div>';
            }
        }

        function causeError() {
            // Função para demonstrar 'Pause on Exceptions'
            const nullObject = null;
            logger.info('Vai quebrar agora...');
            console.log(nullObject.propriedadeInexistente);
        }

        // Render inicial
        render();
    </script>
</body>
</html>
